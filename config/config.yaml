# Autonomous Agent Configuration

# Model settings
model:
  name: "qwen2.5:7b"
  temperature: 0.7
  max_tokens: 4096
  system_prompt: |
    You are Lyra, the user's personal autonomous AI agent, running fully locally
    on their machine. You are capable, practical, and direct.

    YOUR SKILLS — use tools instead of guessing:
    - Computer: mouse/keyboard control, screenshots, shell commands, open apps.
    - Browser: navigate, click, type, screenshots, JavaScript, tabs, downloads.
    - Phone: Android control via ADB (tap, swipe, type, apps, screenshots).
    - Web: web_search for current information, fetch_url to read pages, download_file.
    - Personal kit: calculator, notes, reminders, todos.
    - Filesystem: read, write, search, move, delete files.
    - Memory: store durable facts; check stored facts before asking the user.

    HOW TO WORK:
    1. Understand the goal. If it's ambiguous, make a sensible choice and say what you did.
    2. Plan the steps, then execute them one tool call at a time. Observe each result.
    3. Verify results — read files back, run the check command, confirm the state changed.
    4. Report clearly at the end: what you did, what failed, what's next.
    5. For multi-step work, keep going until the goal is done or genuinely blocked.

    HABITS:
    - Use calculate for any arithmetic instead of guessing.
    - Use web_search for anything time-sensitive or factual you're unsure of.
    - Be honest about failures; never claim something worked if the tool returned an error.
    - If you're unsure about a destructive action, ask for confirmation.

# Command center
server:
  host: "127.0.0.1"
  port: 8420

# Safety settings
safety:
  require_confirmation:
    - "shell_command"
    - "file_delete"
    - "file_write"
    - "phone_app_install"
    - "phone_factory_reset"
    - "browser_execute_js"
  blocked_commands:
    - "rm -rf /"
    - "mkfs"
    - "dd if="
    - "shutdown"
    - "reboot"
    - "halt"
  max_autonomous_actions: 25
  action_log: "logs/actions.jsonl"

# Device control
devices:
  computer:
    enabled: true
    screen_scale: 1.0
  
  phone:
    enabled: true
    device_serial: ""
    screenshot_quality: 80
  
  filesystem:
    enabled: true
    allowed_roots: []
    blocked_paths:
      - "/etc"
      - "/var"
      - "/usr"
      - "/bin"
      - "/sbin"
      - "/boot"
      - "/sys"
      - "/proc"
  
  # Browser automation via Playwright
  browser:
    enabled: true
    # Run browser in headless mode (no visible window)
    headless: true
    # Browser engine: chromium, firefox, webkit
    browser_type: "chromium"
    # Default timeout for page operations (ms)
    timeout: 30000

# Memory
memory:
  db_path: "data/memory.db"
  max_context_turns: 20
  max_tasks: 100

# Agent behavior
agent:
  planning_depth: 5
  auto_continue: true
  action_delay: 0.5

# Webhooks
webhooks:
  enabled: true
  db_path: "data/webhooks.db"
  # Incoming webhooks are accessible at /webhook/<name>
  # Outgoing webhooks POST to external URLs on events

# Plugin system
plugins:
  enabled: true
  directory: "plugins"
  # Plugin-specific config can be added under plugins.<name>
  # Example:
  #   example:
  #     some_setting: "value"
