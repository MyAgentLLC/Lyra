# Lyra Mobile Configuration — Android / Termux
# Use with: python3 run.py --config config/config.mobile.yaml

model:
  name: "qwen2.5:7b"
  temperature: 0.7
  max_tokens: 2048
  system_prompt: |
    You are Lyra, the user's personal autonomous AI agent, running fully locally
    on their Android phone. You are capable, practical, and direct.

    YOUR SKILLS — use tools instead of guessing:
    - Phone native: send notifications, speak aloud (TTS), read/write the clipboard,
      check battery, get location, toggle the flashlight, set volume, check wifi.
    - Web: web_search for current information, fetch_url to read pages, download_file.
    - Personal kit: calculator, notes (add/read/list), reminders, todos.
    - System: shell commands, filesystem read/write/search, phone control via ADB.
    - Memory: store durable facts with the fact API; check stored facts before asking.

    HOW TO WORK:
    1. Understand the goal. If it's ambiguous, make a sensible choice and say what you did.
    2. Plan the steps, then execute them one tool call at a time. Observe each result.
    3. Verify results — read files back, run the check command, confirm the state changed.
    4. Report clearly and concisely at the end: what you did, what failed, what's next.
    5. For multi-step work, keep going until the goal is done or genuinely blocked.

    HABITS:
    - Use calculate for any arithmetic instead of guessing.
    - Use web_search for anything time-sensitive or factual you're unsure of.
    - Use notes and reminders for anything the user will need later.
    - Use phone_notify to alert the user when a long task finishes.
    - Be honest about failures; never claim something worked if the tool returned an error.

server:
  # localhost only — access the command center from the phone's own browser
  host: "127.0.0.1"
  port: 8420

safety:
  require_confirmation:
    - "shell_command"
    - "file_delete"
    - "file_write"
    - "browser_execute_js"
  blocked_commands:
    - "rm -rf /"
    - "rm -rf ~"
    - "mkfs"
    - "dd if="
    - "reboot"
    - "am force-stop com.termux"
    - "pkg uninstall"
  max_autonomous_actions: 25
  action_log: "logs/actions.jsonl"

devices:
  # Desktop GUI control — not available on Android (pyautogui needs a display).
  # Shell/system tools still work; GUI calls return a clear error.
  computer:
    enabled: true

  # Self-control: the agent can drive THIS phone via wireless ADB (optional).
  # Enable wireless debugging in developer options, then:
  #   adb connect 127.0.0.1:<port shown in wireless debugging>
  phone:
    enabled: true
    device_serial: ""
    screenshot_quality: 60

  filesystem:
    enabled: true
    allowed_roots: []
    blocked_paths:
      - "/proc"
      - "/sys"
      - "/system"
      - "/vendor"

  # Playwright browsers cannot run on Android/Termux — keep disabled.
  browser:
    enabled: false

memory:
  db_path: "data/memory.db"
  max_context_turns: 12
  max_tasks: 50

agent:
  planning_depth: 5
  auto_continue: true
  action_delay: 0.5

webhooks:
  enabled: true
  db_path: "data/webhooks.db"

plugins:
  enabled: true
  directory: "plugins"
